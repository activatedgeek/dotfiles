[project]
name = "dotfiles"
version = "0.0.0a"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["myinfra", "python-dotenv"]

[tool.uv]
sources.myinfra = { path = "pkgs/myinfra", editable = true }
sources.xfiles = { path = "pkgs/xfiles", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 119
lint.extend-select = ["I"]
